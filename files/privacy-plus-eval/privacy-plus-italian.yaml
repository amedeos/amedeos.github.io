# =============================================================================
# Italian evaluation set for privacy-plus routing tuning.
# -----------------------------------------------------------------------------
# Each case = an Italian prompt + the DESIRED routing decision (ground truth):
#   expect: local  -> must be kept on the LOCAL model (sensitive / private)
#   expect: sota   -> may go to the external SOTA model (benign)
#
# `expect` encodes a PRIVACY STANCE, not the current policy output — that is the
# whole point: run the set, compare actual vs expect, then tune the knobs in
# policy/privacy-plus.yaml (ner.min_confidence, ner.entity_weights, lexicon
# weights, thresholds) until the routing matches. See eval/README.md.
#
# For a privacy gate the dangerous error is a FALSE NEGATIVE (expect: local but
# routed SOTA = a leak). Tune to drive those to zero first, without sending every
# benign prompt to LOCAL (that would kill the cost/routing value).
#
# All PII/secret values below are SYNTHETIC test values (fake CF, test card
# numbers, example.com emails, placeholder keys) — never real personal data.
# =============================================================================
lang: it
